<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 2학기 [심화 - 17회] 정답</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 16px; color: #1e293b; }
        .card { max-width: 440px; margin: auto; background: #ffffff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; }
        .num { color: #2563eb; font-weight: 800; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main">&lt;4학년 2학기&gt;</span>
            <span class="badge">[심화 - 17회]</span>
        </div>
        <div class="grid">
            <div class="item"><span class="num">①</span><span class="ans">47,652</span></div>
            <div class="item"><span class="num">②</span><span class="ans">44,156</span></div>
            <div class="item"><span class="num">③</span><span class="ans">33,120</span></div>
            <div class="item"><span class="num">④</span><span class="ans">56,448</span></div>
            <div class="item"><span class="num">⑤</span><span class="ans">220,334</span></div>
            <div class="item"><span class="num">⑥</span><span class="ans">20 … 34</span></div>
            <div class="item"><span class="num">⑦</span><span class="ans">24 … 13</span></div>
            <div class="item"><span class="num">⑧</span><span class="ans">22 … 33</span></div>
            <div class="item"><span class="num">⑨</span><span class="ans">16 … 50</span></div>
            <div class="item"><span class="num">⑩</span><span class="ans">23 … 15</span></div>
            <div class="item"><span class="num">⑪</span><span class="ans">667</span></div>
            <div class="item"><span class="num">⑫</span><span class="ans">6,359</span></div>
            <div class="item"><span class="num">⑬</span><span class="ans">6,927</span></div>
            <div class="item"><span class="num">⑭</span><span class="ans">4,559</span></div>
            <div class="item"><span class="num">⑮</span><span class="ans">2,136</span></div>
            <div class="item"><span class="num">⑯</span><span class="ans">4,670</span></div>
            <div class="item"><span class="num">⑰</span><span class="ans">6,439</span></div>
            <div class="item"><span class="num">⑱</span><span class="ans">52,071</span></div>
            <div class="item"><span class="num">⑲</span><span class="ans">37,497</span></div>
            <div class="item"><span class="num">⑳</span><span class="ans">29,552</span></div>
        </div>
    </div>
</body>
</html>
