<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 2학기 [심화 - 45회] 정답</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 16px; color: #1e293b; }
        .card { max-width: 440px; margin: auto; background: #ffffff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; }
        .num { color: #2563eb; font-weight: 800; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main">&lt;4학년 2학기&gt;</span>
            <span class="badge">[심화 - 45회]</span>
        </div>
        <div class="grid">
            <div class="item"><span class="num">①</span><span class="ans">20,167</span></div>
            <div class="item"><span class="num">②</span><span class="ans">17,394</span></div>
            <div class="item"><span class="num">③</span><span class="ans">63,217</span></div>
            <div class="item"><span class="num">④</span><span class="ans">39,600</span></div>
            <div class="item"><span class="num">⑤</span><span class="ans">364,168</span></div>
            <div class="item"><span class="num">⑥</span><span class="ans">10 … 73</span></div>
            <div class="item"><span class="num">⑦</span><span class="ans">9 … 37</span></div>
            <div class="item"><span class="num">⑧</span><span class="ans">12 … 31</span></div>
            <div class="item"><span class="num">⑨</span><span class="ans">21 … 31</span></div>
            <div class="item"><span class="num">⑩</span><span class="ans">12 … 19</span></div>
            <div class="item"><span class="num">⑪</span><span class="ans">800</span></div>
            <div class="item"><span class="num">⑫</span><span class="ans">4,035</span></div>
            <div class="item"><span class="num">⑬</span><span class="ans">6,108</span></div>
            <div class="item"><span class="num">⑭</span><span class="ans">3,477</span></div>
            <div class="item"><span class="num">⑮</span><span class="ans">3,271</span></div>
            <div class="item"><span class="num">⑯</span><span class="ans">6,067</span></div>
            <div class="item"><span class="num">⑰</span><span class="ans">6,263</span></div>
            <div class="item"><span class="num">⑱</span><span class="ans">53,329</span></div>
            <div class="item"><span class="num">⑲</span><span class="ans">7,193</span></div>
            <div class="item"><span class="num">⑳</span><span class="ans">28,157</span></div>
        </div>
    </div>
</body>
</html>
