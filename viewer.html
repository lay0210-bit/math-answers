<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정답 확인</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 14px; color: #1e293b; }
        .card { max-width: 440px; margin: auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { 
            display: grid; 
            grid-template-rows: repeat(10, auto); 
            grid-auto-flow: column; 
            column-gap: 12px; 
            row-gap: 8px; 
        }
        .item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 9px 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 0.92rem; 
        }
        .num { color: #2563eb; font-weight: 800; font-size: 1.05rem; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.02rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main">&lt;4학년 2학기&gt;</span>
            <span class="badge">[정답표]</span>
        </div>
        <div class="grid" id="ans-grid"></div>
    </div>

    <script>
        const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
        const params = new URLSearchParams(window.location.search);
        const rawAns = params.get('a');
        if (rawAns) {
            const separator = rawAns.includes('^') ? '^' : '|';
            const ansList = rawAns.split(separator);
            const grid = document.getElementById('ans-grid');
            ansList.forEach((ans, idx) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="num">${circled[idx] || (idx+1)}</span><span class="ans">${ans}</span>`;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
