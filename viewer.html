<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정답 확인</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 14px; color: #1e293b; }
        .card { max-width: 440px; margin: auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { 
            display: grid; 
            grid-template-rows: repeat(10, auto); 
            grid-auto-flow: column; 
            column-gap: 12px; 
            row-gap: 8px; 
        }
        .item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 9px 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 0.92rem; 
        }
        .num { color: #2563eb; font-weight: 800; font-size: 1.05rem; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.02rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main" id="view-title">&lt;4학년 2학기&gt;</span>
            <span class="badge">[정답표]</span>
        </div>
        <div class="grid" id="ans-grid"></div>
    </div>

    <script>
        const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];

        function createRNG(seed) {
            return function() {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function calculateAnswer(unitKey, idx, rng) {
            const rand = (min, max) => Math.floor(rng() * (max - min + 1)) + min;
            let ans = '';

            if (unitKey === '4-2-adv') {
                if (idx <= 3) {
                    let a = rand(200, 850), b = rand(20, 95);
                    ans = (a * b).toLocaleString();
                } else if (idx === 4) {
                    let a = [12, 14, 15, 16, 24, 25][rand(0, 5)], b = [4, 5, 6, 8][rand(0, 3)], c = rand(150, 350);
                    ans = (a * b * c).toLocaleString();
                } else if (idx === 5) {
                    let a = rand(2500, 7500), b = rand(30, 85);
                    ans = (a * b).toLocaleString();
                } else if (idx <= 10) {
                    let b = rand(25, 88), q = rand(4, 25), r = rand(0, b - 1);
                    ans = r > 0 ? `${q} … ${r}` : `${q}`;
                } else if (idx === 11) {
                    let a = rand(500, 899), b = rand(400, 799), c = rand(200, 550);
                    ans = (a + b - c).toLocaleString();
                } else if (idx <= 14) {
                    let a = rand(3500, 6500), b = rand(500, 890), c = rand(400, 890);
                    ans = (a - b + c).toLocaleString();
                } else if (idx <= 17) {
                    let a = rand(6000, 8500), b = rand(1200, 3200), c = rand(1500, 2800);
                    ans = (a - (b + c)).toLocaleString();
                } else {
                    let a = rand(42000, 78000), b = rand(15000, 28000), c = rand(12000, 24000);
                    ans = (a - b + c).toLocaleString();
                }
            } else if (unitKey === '4-2-mul') {
                let a = rand(150, 950), b = rand(15, 95);
                ans = (a * b).toLocaleString();
            } else if (unitKey === '4-2-div') {
                let b = rand(15, 85), q = rand(5, 30), r = rand(0, b - 1);
                ans = r > 0 ? `${q} … ${r}` : `${q}`;
            } else if (unitKey === '4-2-mix') {
                let a = rand(2000, 8000), b = rand(500, 1800), c = rand(300, 1200);
                ans = (a - (b + c)).toLocaleString();
            } else {
                let a = rand(40000, 80000), b = rand(10000, 30000), c = rand(5000, 15000);
                ans = (a + b - c).toLocaleString();
            }

            return ans;
        }

        const params = new URLSearchParams(window.location.search);
        const unit = params.get('u') || '4-2-adv';
        const seed = parseInt(params.get('s'));

        if (seed) {
            const rng = createRNG(seed);
            const grid = document.getElementById('ans-grid');
            for (let i = 1; i <= 20; i++) {
                const ans = calculateAnswer(unit, i, rng);
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="num">${circled[i - 1]}</span><span class="ans">${ans}</span>`;
                grid.appendChild(div);
            }
        }
    </script>
</body>
</html>
