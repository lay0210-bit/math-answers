<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정답 확인</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 14px; color: #1e293b; }
        .card { max-width: 440px; margin: auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { 
            display: grid; 
            grid-template-rows: repeat(10, auto); 
            grid-auto-flow: column; 
            column-gap: 12px; 
            row-gap: 8px; 
        }
        .item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 9px 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 0.92rem; 
        }
        .num { color: #2563eb; font-weight: 800; font-size: 1.05rem; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.02rem; }
        .empty-msg { text-align: center; color: #64748b; padding: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main">&lt;4학년 2학기&gt;</span>
            <span class="badge">[정답표]</span>
        </div>
        <div class="grid" id="ans-grid"></div>
        <div id="msg" class="empty-msg" style="display:none;">정답 데이터를 불러올 수 없습니다.</div>
    </div>

    <script>
        const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
        
        // URL에서 전달된 정답 목록 읽기
        const params = new URLSearchParams(window.location.search);
        let raw = params.get('a') || params.get('ans');

        if (raw) {
            try {
                // 안전하게 디코딩
                raw = decodeURIComponent(raw);
                const list = raw.split('|');
                const grid = document.getElementById('ans-grid');

                list.forEach((val, idx) => {
                    if (idx >= 20) return;
                    
                    // 순수 숫자는 3자리마다 쉼표(,) 추가, 나눗셈 몫/나머지(…)는 그대로 유지
                    let displayVal = val;
                    if (!isNaN(val) && val.trim() !== '') {
                        displayVal = Number(val).toLocaleString();
                    }

                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `<span class="num">${circled[idx] || (idx + 1)}</span><span class="ans">${displayVal}</span>`;
                    grid.appendChild(div);
                });
            } catch (e) {
                document.getElementById('msg').style.display = 'block';
            }
        } else {
            document.getElementById('msg').style.display = 'block';
        }
    </script>
</body>
</html>
