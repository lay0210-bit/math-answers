<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 2학기 [심화] 정답</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 14px; color: #1e293b; }
        .card { max-width: 440px; margin: auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { 
            display: grid; 
            grid-template-rows: repeat(10, auto); 
            grid-auto-flow: column; 
            column-gap: 12px; 
            row-gap: 8px; 
        }
        .item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 9px 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 0.92rem; 
        }
        .num { color: #2563eb; font-weight: 800; font-size: 1.05rem; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.02rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main">&lt;4학년 2학기&gt;</span>
            <span class="badge">[심화]</span>
        </div>
        <div class="grid" id="ans-grid"></div>
    </div>

    <script>
        const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
        const B64 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";

        function b64ToNum(s) {
            let n = 0;
            for (let i = 0; i < s.length; i++) {
                n = n * 64 + B64.indexOf(s[i]);
            }
            return n;
        }

        const params = new URLSearchParams(window.location.search);
        const data = params.get('d');
        const grid = document.getElementById('ans-grid');

        if (data) {
            const tokens = data.split('.');
            tokens.forEach((tk, idx) => {
                if (idx >= 20) return;
                let ansText = "";
                if (tk.includes('r')) {
                    const parts = tk.split('r');
                    const q = b64ToNum(parts[0]);
                    const r = b64ToNum(parts[1]);
                    ansText = `${q} … ${r}`;
                } else {
                    const val = b64ToNum(tk);
                    ansText = val.toLocaleString();
                }

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="num">${circled[idx]}</span><span class="ans">${ansText}</span>`;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
