<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일 연산 수학 - 맞춤 연산 문제지</title>
    <!-- QR 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-sidebar: #f8fafc;
            --border: #e2e8f0;
            --text-main: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
        body { background: #cbd5e1; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* 좌측 단원 선택 사이드바 */
        #sidebar {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
        }

        .site-title {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .grade-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #64748b;
            margin-top: 16px;
            margin-bottom: 8px;
            padding-left: 6px;
        }
        .grade-title:first-child { margin-top: 0; }

        .unit-btn {
            width: 100%;
            text-align: left;
            padding: 11px 14px;
            margin-bottom: 6px;
            background: var(--bg-sidebar);
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .unit-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .unit-btn.active { background: #eff6ff; border-color: var(--primary); color: var(--primary); font-weight: 800; }

        /* 우측 영역 */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .top-bar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .unit-heading {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }
        .btn-reload { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-reload:hover { background: #e2e8f0; }
        .btn-print { background: var(--primary); color: #ffffff; }
        .btn-print:hover { background: var(--primary-dark); }

        /* A4 정밀 규격 (위쪽 1.2cm, 아래쪽 2.5cm 반영) */
        .sheet-container {
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .a4-paper {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 12mm 19mm 25mm 19mm; /* 상단 1.2cm, 좌우 1.9cm, 하단 2.5cm */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 헤더 */
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .sheet-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .sheet-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.5px;
        }

        .sheet-badge {
            background: #1e293b;
            color: #ffffff;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 5px;
        }

        /* QR 코드 */
        .qr-wrapper {
            background: #ffffff;
            padding: 0;
            display: inline-block;
        }
        #qrcode {
            width: 76px;
            height: 76px;
        }
        #qrcode img, #qrcode canvas {
            display: block;
            width: 76px !important;
            height: 76px !important;
        }

        /* 20문제 배치 (줄간격 72px) */
        .sheet-problems {
            flex: 1;
            display: grid;
            grid-template-rows: repeat(10, 72px);
            grid-auto-flow: column;
            column-gap: 55px;
            align-content: space-between;
        }

        .prob-row {
            display: flex;
            align-items: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: #000000;
        }

        .prob-num {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 24px;
            height: 24px;
            border: 1.4px solid #000000;
            border-radius: 50%;
            font-size: 0.82rem;
            font-weight: 800;
            margin-right: 13px;
            flex-shrink: 0;
        }

        /* 인쇄 시에도 정확히 위쪽 1.2cm, 아래쪽 2.5cm 유지 */
        @media print {
            body { background: #fff !important; }
            #sidebar, .top-bar { display: none !important; }
            #main-content { overflow: visible !important; height: auto !important; }
            .sheet-container { padding: 0 !important; margin: 0 !important; }
            .a4-paper {
                box-shadow: none !important;
                padding: 12mm 19mm 25mm 19mm !important; /* 인쇄 시 1.2cm / 2.5cm */
                width: 210mm !important;
                height: 297mm !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="site-title">✏️ 나만의 일일 수학</div>
        <div class="category-list">
            <div class="grade-title">초등 4학년 2학기</div>
            <button class="unit-btn active" onclick="selectUnit(event, '4-2-adv')">4-2. 연산 총괄 심화 (20문항)</button>
            <button class="unit-btn" onclick="selectUnit(event, '4-2-mul')">4-2. (세 자리 수) × (두 자리 수)</button>
            <button class="unit-btn" onclick="selectUnit(event, '4-2-div')">4-2. (두·세 자리 수) ÷ (두 자리 수)</button>
            <button class="unit-btn" onclick="selectUnit(event, '4-2-mix')">4-2. 덧셈과 뺄셈의 혼합 계산</button>

            <div class="grade-title">초등 4학년 1학기</div>
            <button class="unit-btn" onclick="selectUnit(event, '4-1-big')">4-1. 큰 수의 덧셈과 뺄셈</button>
        </div>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="unit-heading" id="currentUnitTitle">&lt;4학년 2학기&gt; [심화]</div>
            <div class="btn-group">
                <button class="btn btn-reload" onclick="generateSheet()">🔄 다른 문제 풀기</button>
                <button class="btn btn-print" onclick="window.print()">🖨️ 시험지 인쇄</button>
            </div>
        </div>

        <div class="sheet-container">
            <div class="a4-paper">
                <div class="sheet-header">
                    <div class="sheet-header-left">
                        <span class="sheet-title" id="paperTitle">&lt;4학년 2학기&gt;</span>
                        <span class="sheet-badge" id="paperBadge">[심화]</span>
                    </div>
                    <div class="qr-wrapper">
                        <div id="qrcode"></div>
                    </div>
                </div>

                <div class="sheet-problems" id="problemContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = '4-2-adv';
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // 초소형 압축 문자셋 (URL 단축용)
        const B64 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
        function numToB64(n) {
            if (n === 0) return "0";
            let s = "";
            while (n > 0) {
                s = B64[n % 64] + s;
                n = Math.floor(n / 64);
            }
            return s;
        }

        function selectUnit(e, unitKey) {
            currentUnit = unitKey;
            document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
            if (e && e.target) e.target.classList.add('active');

            const titleMap = {
                '4-2-adv': { title: '<4학년 2학기>', badge: '[심화]' },
                '4-2-mul': { title: '<4학년 2학기>', badge: '[곱셈 특화]' },
                '4-2-div': { title: '<4학년 2학기>', badge: '[나눗셈 특화]' },
                '4-2-mix': { title: '<4학년 2학기>', badge: '[혼합 계산]' },
                '4-1-big': { title: '<4학년 1학기>', badge: '[큰 수 연산]' }
            };

            const info = titleMap[unitKey] || { title: '<수학 연산>', badge: '[심화]' };
            document.getElementById('currentUnitTitle').innerText = `${info.title} ${info.badge}`;
            document.getElementById('paperTitle').innerText = info.title;
            document.getElementById('paperBadge').innerText = info.badge;

            generateSheet();
        }

        function getProblem(unitKey, idx) {
            let prob = '', ansCode = '';

            if (unitKey === '4-2-adv') {
                if (idx <= 3) {
                    let a = rand(200, 850), b = rand(20, 95);
                    prob = `${a} × ${b} =`;
                    ansCode = numToB64(a * b);
                } else if (idx === 4) {
                    let a = [12, 14, 15, 16, 24, 25][rand(0, 5)], b = [4, 5, 6, 8][rand(0, 3)], c = rand(150, 350);
                    prob = `${a} × ${b} × ${c} =`;
                    ansCode = numToB64(a * b * c);
                } else if (idx === 5) {
                    let a = rand(2500, 7500), b = rand(30, 85);
                    prob = `${a} × ${b} =`;
                    ansCode = numToB64(a * b);
                } else if (idx <= 10) {
                    let b = rand(25, 88), q = rand(4, 25), r = rand(0, b - 1);
                    let a = (b * q) + r;
                    prob = `${a} ÷ ${b} =`;
                    ansCode = r > 0 ? `${numToB64(q)}r${numToB64(r)}` : numToB64(q);
                } else if (idx === 11) {
                    let a = rand(500, 899), b = rand(400, 799), c = rand(200, 550);
                    prob = `${a} + ${b} - ${c} =`;
                    ansCode = numToB64(a + b - c);
                } else if (idx <= 14) {
                    let a = rand(3500, 6500), b = rand(500, 890), c = rand(400, 890);
                    prob = `${a} - ${b} + ${c} =`;
                    ansCode = numToB64(a - b + c);
                } else if (idx <= 17) {
                    let a = rand(6000, 8500), b = rand(1200, 3200), c = rand(1500, 2800);
                    prob = `${a} - (${b} + ${c}) =`;
                    ansCode = numToB64(a - (b + c));
                } else {
                    let a = rand(42000, 78000), b = rand(15000, 28000), c = rand(12000, 24000);
                    prob = `${a.toLocaleString()} - ${b.toLocaleString()} + ${c.toLocaleString()} =`;
                    ansCode = numToB64(a - b + c);
                }
            } else if (unitKey === '4-2-mul') {
                let a = rand(150, 950), b = rand(15, 95);
                prob = `${a} × ${b} =`;
                ansCode = numToB64(a * b);
            } else if (unitKey === '4-2-div') {
                let b = rand(15, 85), q = rand(5, 30), r = rand(0, b - 1);
                let a = (b * q) + r;
                prob = `${a} ÷ ${b} =`;
                ansCode = r > 0 ? `${numToB64(q)}r${numToB64(r)}` : numToB64(q);
            } else if (unitKey === '4-2-mix') {
                let a = rand(2000, 8000), b = rand(500, 1800), c = rand(300, 1200);
                prob = `${a} - (${b} + ${c}) =`;
                ansCode = numToB64(a - (b + c));
            } else {
                let a = rand(40000, 80000), b = rand(10000, 30000), c = rand(5000, 15000);
                prob = `${a.toLocaleString()} + ${b.toLocaleString()} - ${c.toLocaleString()} =`;
                ansCode = numToB64(a + b - c);
            }

            return { prob, ansCode };
        }

        function generateSheet() {
            const container = document.getElementById('problemContainer');
            container.innerHTML = '';
            let compressedTokens = [];

            for (let i = 1; i <= 20; i++) {
                const { prob, ansCode } = getProblem(currentUnit, i);
                compressedTokens.push(ansCode);

                const div = document.createElement('div');
                div.className = 'prob-row';
                div.innerHTML = `<span class="prob-num">${i}</span><span>${prob}</span>`;
                container.appendChild(div);
            }

            // 초압축 QR코드 생성
            const qrBox = document.getElementById('qrcode');
            qrBox.innerHTML = '';

            const shortData = compressedTokens.join('.');
            const answerUrl = `https://lay0210-bit.github.io/math-answers/viewer.html?d=${shortData}`;

            new QRCode(qrBox, {
                text: answerUrl,
                width: 76,
                height: 76,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        }

        window.onload = generateSheet;
    </script>
</body>
</html>
