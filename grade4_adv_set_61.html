<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4학년 2학기 정답 확인</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; background: #f8fafc; margin: 0; padding: 14px; color: #1e293b; }
        .card { max-width: 450px; margin: auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .title-main { font-size: 1.25rem; font-weight: 800; color: #0f172a; }
        .badge { background: #1e293b; color: #ffffff; padding: 4px 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 700; }
        .grid { 
            display: grid; 
            grid-template-rows: repeat(10, auto); 
            grid-auto-flow: column; 
            column-gap: 12px; 
            row-gap: 8px; 
        }
        .item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 9px 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 0.92rem; 
        }
        .num { color: #2563eb; font-weight: 800; font-size: 1.05rem; }
        .ans { color: #dc2626; font-weight: 800; font-size: 1.02rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="title-main">&lt;4학년 2학기&gt;</span>
            <span class="badge">[심화]</span>
        </div>
        <div class="grid">
            <div class="item"><span class="num">①</span><span class="ans">12,282</span></div>
            <div class="item"><span class="num">②</span><span class="ans">23,436</span></div>
            <div class="item"><span class="num">③</span><span class="ans">13,752</span></div>
            <div class="item"><span class="num">④</span><span class="ans">14,420</span></div>
            <div class="item"><span class="num">⑤</span><span class="ans">181,314</span></div>
            <div class="item"><span class="num">⑥</span><span class="ans">12 … 22</span></div>
            <div class="item"><span class="num">⑦</span><span class="ans">14 … 16</span></div>
            <div class="item"><span class="num">⑧</span><span class="ans">14 … 28</span></div>
            <div class="item"><span class="num">⑨</span><span class="ans">22 … 58</span></div>
            <div class="item"><span class="num">⑩</span><span class="ans">5 … 6</span></div>
            <div class="item"><span class="num">⑪</span><span class="ans">1,024</span></div>
            <div class="item"><span class="num">⑫</span><span class="ans">4,738</span></div>
            <div class="item"><span class="num">⑬</span><span class="ans">7,141</span></div>
            <div class="item"><span class="num">⑭</span><span class="ans">3,326</span></div>
            <div class="item"><span class="num">⑮</span><span class="ans">4,382</span></div>
            <div class="item"><span class="num">⑯</span><span class="ans">5,292</span></div>
            <div class="item"><span class="num">⑰</span><span class="ans">6,088</span></div>
            <div class="item"><span class="num">⑱</span><span class="ans">41,128</span></div>
            <div class="item"><span class="num">⑲</span><span class="ans">42,486</span></div>
            <div class="item"><span class="num">⑳</span><span class="ans">19,618</span></div>
        </div>
    </div>
</body>
</html>
